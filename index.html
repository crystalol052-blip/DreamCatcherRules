<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Міні-вікно</title>
    <!-- Підключаємо скрипт Telegram -->
    <script src="https://telegram.org"></script>
    <style>
    /* Налаштування для темної теми за замовчуванням (якщо месенджер або телефон у нічному режимі) */
    @media (prefers-color-scheme: dark) {
        body {
            background-color: #1c1c1e;
            color: #ffffff;
        }
    }

    /* Налаштування з використанням офіційних змінних Telegram */
    body {
        font-family: Arial, sans-serif;
        /* Спочатку бере колір ТГ, якщо його немає — колір системи */
        background-color: var(--tg-theme-bg-color, window); 
        color: var(--tg-theme-text-color, windowtext);
        padding: 20px;
        text-align: center;
        margin: 0;
    }

    h2 {
        font-size: 10px;       /* Робить літери великими */
        font-weight: bold;     /* Робить текст жирним */
        margin-bottom: 10px;
    }
    .container {
        border: 1px solid var(--tg-theme-hint-color, #ccc);
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        background-color: var(--tg-theme-secondary-bg-color, transparent);
    }
        
</style>

</head>
<body>

    <div class="container">
        <h2>Приветствую вас в разделе правил для пользователей нашего бота</h2>
        <p>1.1</p>
    </div>

    <script>
        // Ініціалізація WebApp та повідомлення Telegram, що додаток готовий
        Telegram.WebApp.ready();
        // Автоматично розгортає вікно на максимум (опціонально)
        Telegram.WebApp.expand(); 
    </script>
</body>
</html>
